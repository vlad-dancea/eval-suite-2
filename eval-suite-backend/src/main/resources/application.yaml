spring:
    datasource:
        url: jdbc:postgresql://localhost:5433/eval_suite
        username: eval_suite
        password: eval_suite
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false

    sql:
        init:
            mode: always

    ai:
        model:
            chat: openai
            embedding: none
            image: none
            moderation: none
            audio:
                speech: none
                transcription: none
        openai:
            base-url: https://aqueduct.ai.datalab.tuwien.ac.at
            api-key: ${AQUEDUCT_API_KEY:}
            chat:
                options:
                    model: ${AQUEDUCT_MAIN_MODEL:}

    http:
        client:
            factory: jdk
            connect-timeout: 10s
            read-timeout: 3m

aqueduct:
    main-model: ${AQUEDUCT_MAIN_MODEL:}
    judge-model: ${AQUEDUCT_JUDGE_MODEL:${AQUEDUCT_MAIN_MODEL:}}

management:
    health:
        redis:
            enabled: false
